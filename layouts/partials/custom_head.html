<style>
  :root {
    --background-color: #6adcff;
    --heading-color: #000;
    --text-color: #000;
    --link-color: #000;
    --visited-color: #333;
    --font-main: 'IBM Plex Sans', sans-serif;
    --font-secondary: 'IBM Plex Sans', sans-serif;
    --width: 575px;
    --gap: 1.25rem;
  }

  [data-theme="dark"] {
    --background-color: #2c3539;
    --heading-color: #e8eaeb;
    --text-color: #d1d5d7;
    --link-color: #e8eaeb;
    --visited-color: #a8b0b4;
  }

  [data-theme="80s"] {
    --background-color: #0a0a12;
    --heading-color: #ffffff;
    --text-color: #f0e6ff;
    --link-color: #00f5d4;
    --visited-color: #ff3af2;
    --max-accent-1: #ff3af2;
    --max-accent-2: #00f5d4;
    --max-accent-3: #ffe600;
    --max-accent-4: #ff6b35;
    --max-accent-5: #7b2fff;
    --max-accent-6: #ff1493;
    --max-muted: #2d1b4e;
    --sun-top: #fff200;
    --sun-mid: #ff6b00;
    --sun-bottom: #ff0066;
    --grid-color: rgba(0, 245, 212, 0.6);
    --horizon-glow: rgba(255, 0, 102, 0.4);
  }

  body {
    font-family: var(--font-secondary);
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    margin: calc(var(--gap) * 4) 0 calc(var(--gap) * 6) 0;
    padding: 0;
    max-width: none;
  }

  [data-theme="80s"] body {
    background-color: var(--background-color);
    background-image:
      radial-gradient(ellipse at 20% 30%, rgba(255, 58, 242, 0.2) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(0, 245, 212, 0.2) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 10%, rgba(123, 47, 255, 0.18) 0%, transparent 60%);
    background-attachment: fixed;
  }

  [data-theme="80s"] body::before,
  [data-theme="80s"] body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  [data-theme="80s"] body::before {
    background-image:
      radial-gradient(circle, rgba(255, 58, 242, 0.3) 1px, transparent 1px),
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255, 230, 0, 0.08) 10px,
        rgba(255, 230, 0, 0.08) 20px
      );
    background-size: 22px 22px, auto;
    mix-blend-mode: screen;
    opacity: 0.5;
  }

  [data-theme="80s"] body::after {
    background-image:
      conic-gradient(
        from 90deg at 1px 1px,
        transparent 90deg,
        rgba(0, 245, 212, 0.08) 0
      );
    background-size: 36px 36px;
    mix-blend-mode: overlay;
    opacity: 0.35;
  }

  /* CRT Scanlines overlay */
  [data-theme="80s"] .crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.15) 0px,
      rgba(0, 0, 0, 0.15) 1px,
      transparent 1px,
      transparent 2px
    );
    animation: scanline-flicker 0.05s infinite;
  }

  [data-theme="80s"] .crt-overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
  }

  /* VHS Glitch effect */
  [data-theme="80s"] .vhs-glitch {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    opacity: 0;
    animation: vhs-tracking 8s ease-in-out infinite;
  }

  [data-theme="80s"] .vhs-glitch::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, rgba(255, 58, 242, 0.8), rgba(0, 245, 212, 0.8), transparent);
    animation: vhs-line 3s linear infinite;
  }

  /* Synthwave horizon scene */
  [data-theme="80s"] .synthwave-scene {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45vh;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* Retro Sun */
  [data-theme="80s"] .retro-sun {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: linear-gradient(
      180deg,
      var(--sun-top) 0%,
      var(--sun-mid) 50%,
      var(--sun-bottom) 100%
    );
    box-shadow:
      0 0 80px rgba(255, 100, 0, 0.6),
      0 0 160px rgba(255, 0, 102, 0.4),
      0 0 280px rgba(255, 0, 102, 0.25);
    animation: sun-pulse 4s ease-in-out infinite;
    /* Horizontal lines through sun */
    -webkit-mask-image: repeating-linear-gradient(
      0deg,
      #000 0px,
      #000 12px,
      transparent 12px,
      transparent 18px
    );
    mask-image: repeating-linear-gradient(
      0deg,
      #000 0px,
      #000 12px,
      transparent 12px,
      transparent 18px
    );
  }

  [data-theme="80s"] .retro-sun::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(
      180deg,
      transparent 0%,
      transparent 55%,
      var(--background-color) 55%,
      var(--background-color) 100%
    );
  }

  /* Horizon glow */
  [data-theme="80s"] .horizon-glow {
    position: absolute;
    bottom: 28%;
    left: 0;
    right: 0;
    height: 180px;
    background: linear-gradient(
      0deg,
      transparent 0%,
      var(--horizon-glow) 40%,
      rgba(255, 100, 0, 0.4) 70%,
      transparent 100%
    );
    filter: blur(30px);
  }

  /* Neon Grid Floor */
  [data-theme="80s"] .neon-grid {
    position: absolute;
    bottom: 0;
    left: -50%;
    right: -50%;
    height: 35%;
    background:
      linear-gradient(90deg,
        transparent 0%,
        rgba(0, 245, 212, 0.9) 1px,
        rgba(0, 245, 212, 0.4) 2px,
        transparent 3px
      ),
      linear-gradient(0deg,
        rgba(255, 58, 242, 0.9) 1px,
        rgba(255, 58, 242, 0.4) 2px,
        transparent 3px
      );
    background-size: 80px 40px;
    transform: perspective(300px) rotateX(65deg);
    transform-origin: center top;
    animation: grid-scroll 1.5s linear infinite;
    filter: drop-shadow(0 0 3px rgba(0, 245, 212, 0.8));
  }

  [data-theme="80s"] .neon-grid::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, transparent 0%, var(--background-color) 80%);
  }

  /* Palm trees */
  [data-theme="80s"] .palm-tree {
    position: absolute;
    bottom: 26%;
    width: 100px;
    height: 200px;
    filter: drop-shadow(0 0 15px rgba(255, 58, 242, 0.5));
  }

  [data-theme="80s"] .palm-tree-left {
    left: 8%;
    transform: scaleX(-1);
  }

  [data-theme="80s"] .palm-tree-right {
    right: 8%;
  }

  [data-theme="80s"] .palm-trunk {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 130px;
    background: linear-gradient(90deg, #1a0a2e, #2d1b4e, #1a0a2e);
    border-radius: 4px;
  }

  [data-theme="80s"] .palm-frond {
    position: absolute;
    bottom: 115px;
    left: 50%;
    width: 75px;
    height: 38px;
    background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 100%);
    border-radius: 100% 0 100% 0;
    transform-origin: left center;
  }

  [data-theme="80s"] .palm-frond:nth-child(1) { transform: translateX(-50%) rotate(-70deg); }
  [data-theme="80s"] .palm-frond:nth-child(2) { transform: translateX(-50%) rotate(-40deg); }
  [data-theme="80s"] .palm-frond:nth-child(3) { transform: translateX(-50%) rotate(-10deg); }
  [data-theme="80s"] .palm-frond:nth-child(4) { transform: translateX(-50%) rotate(20deg); width: 65px; }
  [data-theme="80s"] .palm-frond:nth-child(5) { transform: translateX(-50%) rotate(50deg); width: 70px; }

  /* Stars */
  [data-theme="80s"] .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  [data-theme="80s"] .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }

  [data-theme="80s"] .maxi-shapes {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  /* Hide all shapes by default in 80s mode */
  [data-theme="80s"] .shape {
    display: none;
  }

  /* Show only a few large shapes */
  [data-theme="80s"] .shape-c1,
  [data-theme="80s"] .shape-t1,
  [data-theme="80s"] .shape-z1,
  [data-theme="80s"] .shape-c3 {
    display: block;
    position: absolute;
    mix-blend-mode: screen;
    opacity: 0.7;
  }

  /* Large yellow circle - top left area */
  [data-theme="80s"] .shape-c1 {
    width: 180px;
    height: 180px;
    top: 8%;
    left: 5%;
    background: var(--max-accent-3);
    border-radius: 50%;
    box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.3);
    animation: float-large 8s ease-in-out infinite;
  }

  /* Sharp angular pink triangle - overlapping with circle */
  [data-theme="80s"] .shape-t1 {
    width: 0;
    height: 0;
    border-left: 40px solid transparent;
    border-right: 100px solid transparent;
    border-bottom: 180px solid var(--max-accent-1);
    top: 5%;
    left: 15%;
    filter: drop-shadow(10px 10px 0 rgba(0, 0, 0, 0.3));
    animation: float-large-reverse 10s ease-in-out infinite;
    transform: rotate(12deg);
  }

  /* Large cyan zigzag - right side */
  [data-theme="80s"] .shape-z1 {
    width: 200px;
    height: 30px;
    top: 20%;
    right: 8%;
    background: var(--max-accent-2);
    box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.3);
    clip-path: polygon(0 40%, 20% 0, 40% 40%, 60% 0, 80% 40%, 100% 0, 100% 60%, 80% 100%, 60% 60%, 40% 100%, 20% 60%, 0 100%);
    animation: float-large 12s ease-in-out infinite;
    transform: rotate(-15deg);
  }

  /* Another yellow circle - bottom right, overlapping */
  [data-theme="80s"] .shape-c3 {
    width: 140px;
    height: 140px;
    top: 25%;
    right: 12%;
    background: var(--max-accent-3);
    border-radius: 50%;
    box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.3);
    animation: float-large-reverse 9s ease-in-out infinite;
  }

  @keyframes float-large {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(20px, -30px) rotate(5deg); }
    50% { transform: translate(-15px, 20px) rotate(-3deg); }
    75% { transform: translate(25px, 15px) rotate(4deg); }
  }

  @keyframes float-large-reverse {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-25px, 20px) rotate(-4deg); }
    50% { transform: translate(20px, -25px) rotate(5deg); }
    75% { transform: translate(-20px, -15px) rotate(-3deg); }
  }

  header,
  main,
  footer {
    width: min(var(--width), 96vw);
    margin-left: auto;
    margin-right: auto;
  }

  [data-theme="80s"] h1,
  [data-theme="80s"] h2,
  [data-theme="80s"] h3,
  [data-theme="80s"] h4,
  [data-theme="80s"] h5,
  [data-theme="80s"] h6 {
    font-family: 'Orbitron', 'Outfit', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 900;
  }

  /* Chrome metallic text effect for h1 */
  [data-theme="80s"] h1 {
    background: linear-gradient(
      180deg,
      #fff 0%,
      #fff 35%,
      #aaa 45%,
      #fff 50%,
      #888 55%,
      #ddd 65%,
      #fff 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 10px rgba(255, 58, 242, 0.6)) drop-shadow(0 0 30px rgba(0, 245, 212, 0.4));
    position: relative;
  }

  [data-theme="80s"] h1::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    background: linear-gradient(90deg, var(--max-accent-1), var(--max-accent-2), var(--max-accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: chrome-flash 5s ease-in-out infinite;
  }

  /* Neon glow text for h2 */
  [data-theme="80s"] h2 {
    color: var(--max-accent-2);
    text-shadow:
      0 0 5px var(--max-accent-2),
      0 0 10px var(--max-accent-2),
      0 0 20px var(--max-accent-2),
      0 0 40px var(--max-accent-1),
      0 0 80px var(--max-accent-1);
    animation: neon-flicker 3s ease-in-out infinite;
  }

  /* Hot pink neon for h3 */
  [data-theme="80s"] h3 {
    color: var(--max-accent-1);
    text-shadow:
      0 0 5px var(--max-accent-1),
      0 0 10px var(--max-accent-1),
      0 0 20px var(--max-accent-1),
      0 0 40px var(--max-accent-5);
  }

  [data-theme="80s"] main h2 {
    background: linear-gradient(90deg, #ff3af2, #00f5d4, #ffe600, #ff3af2);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradient-shift 4s ease infinite;
    text-shadow: none;
    filter: drop-shadow(0 0 8px rgba(255, 58, 242, 0.5)) drop-shadow(0 0 16px rgba(0, 245, 212, 0.3));
  }

  [data-theme="80s"] body {
    font-family: 'Space Grotesk', 'DM Sans', sans-serif;
    letter-spacing: 0.01em;
  }

  [data-theme="80s"] main::before {
    display: none;
  }

  [data-theme="80s"] main {
    position: relative;
    z-index: 1;
  }

  [data-theme="80s"] .about-inner p:first-child {
    font-family: 'Bangers', cursive;
    font-size: 1.4em;
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, #ff3af2, #00f5d4, #ffe600, #ff3af2);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradient-shift 4s ease infinite;
  }

  [data-theme="80s"] header,
  [data-theme="80s"] main,
  [data-theme="80s"] footer {
    position: relative;
    z-index: 1;
  }

  /* Header layout */
  .header-container {
    --logo-offset: 64px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 20px;
    margin-bottom: 20px;
    position: relative;
  }

  .logo {
    position: absolute;
    left: calc(-1 * var(--logo-offset));
    top: 50%;
    transform: translateY(-50%);
  }

  .logo img {
    display: block;
  }

  [data-theme="80s"] .logo,
  [data-theme="80s"] .about-photo {
    display: none;
  }

  nav {
    flex: 1;
    text-align: left;
  }

  nav a {
    margin: 0 10px;
    text-decoration: none;
  }

  nav a:hover {
    text-decoration: underline;
  }

  [data-theme="80s"] nav a {
    text-transform: uppercase;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  [data-theme="80s"] nav a:hover {
    color: var(--max-accent-3);
    text-decoration: none;
    text-shadow: 2px 2px 0 var(--max-accent-5), 4px 4px 0 var(--max-accent-1);
  }

  [data-theme="80s"] nav a {
    transition: transform 200ms ease, color 200ms ease, text-shadow 200ms ease;
  }

  [data-theme="80s"] nav a:hover {
    transform: translateY(-2px) scale(1.04);
  }

  /* Theme toggle button */
  #theme-toggle {
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
    color: var(--text-color);
    margin-left: 6px;
  }

  #theme-toggle:hover {
    opacity: 0.7;
  }

  #theme-80s-toggle {
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
    color: var(--text-color);
    margin-left: auto;
  }

  #theme-80s-toggle:hover {
    opacity: 0.8;
  }

  #theme-80s-toggle .bi {
    font-size: 22px;
    line-height: 1;
    display: block;
  }

  [data-theme="80s"] #theme-80s-toggle {
    color: var(--max-accent-3);
    box-shadow: 0 0 12px rgba(255, 230, 0, 0.6), 0 0 24px rgba(255, 58, 242, 0.4);
    border-radius: 9999px;
  }

  [data-theme="80s"] #theme-toggle,
  [data-theme="80s"] #theme-80s-toggle {
    transition: transform 200ms ease, box-shadow 200ms ease;
  }

  [data-theme="80s"] #theme-toggle:hover,
  [data-theme="80s"] #theme-80s-toggle:hover {
    transform: scale(1.08) rotate(-4deg);
    box-shadow: 0 0 20px rgba(255, 58, 242, 0.6), 0 0 40px rgba(0, 245, 212, 0.4);
  }

  .sun-icon {
    display: none;
  }

  .moon-icon {
    display: block;
  }

  [data-theme="dark"] .sun-icon {
    display: block;
  }

  [data-theme="dark"] .moon-icon {
    display: none;
  }

  /* About box */
  .about {
    width: 96vw;
    max-width: calc(var(--width) + 50px);
    margin-top: calc(var(--gap) * 2);
    margin-bottom: calc(var(--gap) * 2);
    position: relative;
  }

  .about::after {
    content: "";
    display: block;
    clear: both;
  }

  .about-photo {
    position: absolute;
    width: 128px;
    height: 128px;
    left: -150px;
    top: 50%;
    transform: translateY(-50%);
    background-image: var(--about-photo-light);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: transparent;
  }

  [data-theme="dark"] .about-photo {
    background-image: var(--about-photo-dark);
  }


  .about-inner {
    font-size: 0.95em;
    padding: 0.6rem 20px;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }

  [data-theme="80s"] .about-inner {
    background: rgba(45, 27, 78, 0.7);
    border: 4px solid var(--max-accent-3);
    border-style: dashed;
    border-radius: 16px;
    box-shadow: 8px 8px 0 var(--max-accent-2), 16px 16px 0 var(--max-accent-1);
  }

  [data-theme="80s"] .about-inner:hover {
    transform: rotate(1deg) scale(1.01);
    box-shadow: 12px 12px 0 var(--max-accent-4), 24px 24px 0 var(--max-accent-1);
    transition: transform 250ms ease, box-shadow 250ms ease;
  }

  [data-theme="dark"] .about-inner {
    border-color: rgba(255, 255, 255, 0.2);
  }

  /* Footer icons */
  .footer-icons {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 12px 0;
  }

  [data-theme="80s"] .footer-icons {
    gap: 20px;
  }

  .footer-icon {
    display: inline-flex;
    width: 24px;
    height: 24px;
    color: var(--text-color);
  }

  .footer-icon svg {
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  /* Work items */
  .work-item {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin: 0 0 var(--gap) 0;
  }

  [data-theme="80s"] .work-item {
    background: rgba(45, 27, 78, 0.6);
    border: 4px solid var(--max-accent-1);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 0 24px rgba(255, 58, 242, 0.4), 8px 8px 0 var(--max-accent-3);
  }

  [data-theme="80s"] .work-item:nth-of-type(2n) {
    border-style: dotted;
    border-color: var(--max-accent-2);
    transform: translateY(6px) rotate(0.5deg);
  }

  [data-theme="80s"] .work-item:nth-of-type(3n) {
    border-style: dashed;
    border-color: var(--max-accent-5);
    transform: translateY(-6px) rotate(-0.5deg);
  }

  [data-theme="80s"] .work-item:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow:
      0 0 30px rgba(255, 58, 242, 0.6),
      10px 10px 0 var(--max-accent-4),
      20px 20px 0 var(--max-accent-2);
    transition: transform 250ms ease, box-shadow 250ms ease;
  }

  .work-item-media {
    width: 160px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 6px;
    margin-left: -160px;
  }

  .work-item-media img {
    width: 100%;
    height: auto;
    display: block;
  }

  .work-item-title {
    margin: 0 0 0.35rem 0;
    font-weight: 600;
  }

  [data-theme="80s"] .work-item-title {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-shadow: 2px 2px 0 var(--max-accent-5), 4px 4px 0 var(--max-accent-1);
  }

  .work-item-description {
    margin: 0;
  }

  /* Post heading list style */
  ul.blog-posts li {
    display: block;
  }

  .post-heading {
    display: inline-block;
    padding-bottom: 0;
    text-decoration: none;
  }

  .post-heading:hover {
    text-decoration: none;
  }

  .post-heading:hover .post-date-inline {
    text-decoration: none;
