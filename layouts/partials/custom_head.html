<style>
  :root{
    --background-color: #6adcff;
    --heading-color: #000;
    --text-color: #000;
    --link-color: #000;
    --visited-color: #333;
    --font-main: 'IBM Plex Sans', sans-serif;
    --font-secondary: 'IBM Plex Sans', sans-serif;
    --width: 575px;
    --gap: 1.25rem;
  }

  [data-theme="dark"]{
    --background-color: #2c3539;
    --heading-color: #e8eaeb;
    --text-color: #d1d5d7;
    --link-color: #e8eaeb;
    --visited-color: #a8b0b4;
  }

  

  body{
    font-family: var(--font-secondary);
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    margin: calc(var(--gap) * 2) 0 calc(var(--gap) * 6) 0;
    padding: 0 0 calc(var(--gap) * 1.5) 0;
    max-width: none;
  }

  @keyframes float-large{
    0% { transform: translate(0, 0) rotate(0deg); }
    15% { transform: translate(35px, -45px) rotate(8deg); }
    30% { transform: translate(-25px, -20px) rotate(-5deg); }
    45% { transform: translate(50px, 30px) rotate(12deg); }
    60% { transform: translate(-40px, 50px) rotate(-8deg); }
    75% { transform: translate(20px, -35px) rotate(6deg); }
    90% { transform: translate(-30px, 15px) rotate(-10deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes float-large-reverse{
    0% { transform: translate(0, 0) rotate(0deg); }
    12% { transform: translate(-45px, 30px) rotate(-10deg); }
    28% { transform: translate(30px, -40px) rotate(7deg); }
    42% { transform: translate(-20px, -50px) rotate(-6deg); }
    58% { transform: translate(55px, 25px) rotate(11deg); }
    72% { transform: translate(-35px, 45px) rotate(-9deg); }
    88% { transform: translate(25px, -20px) rotate(5deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes float-zigzag{
    0% { transform: translate(0, 0) rotate(-15deg); }
    20% { transform: translate(-40px, -30px) rotate(-25deg); }
    40% { transform: translate(45px, 20px) rotate(-5deg); }
    60% { transform: translate(-30px, 40px) rotate(-30deg); }
    80% { transform: translate(35px, -25px) rotate(-10deg); }
    100% { transform: translate(0, 0) rotate(-15deg); }
  }

  header,
  main,
  footer{
    width: min(var(--width), 96vw);
    margin-left: auto;
    margin-right: auto;
  }

  main{
    flex: 1;
  }

  footer{
    margin-top: auto;
    margin-bottom: 25px;
  }

  

  /* Chrome metallic text effect for h1 */
  

  

  /* Neon glow text for h2 */
  

  /* Hot pink neon for h3 */
  

  

  

  

  

  

  

  /* Header layout */
  .header-container{
    --logo-offset: 64px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 20px;
    margin-bottom: 20px;
    position: relative;
  }

  .logo{
    position: absolute;
    left: calc(-1 * var(--logo-offset));
    top: 50%;
    transform: translateY(-50%);
  }

  .logo img{
    display: block;
  }

  

  nav{
    flex: 1;
    text-align: left;
  }

  nav a{
    margin-right: 20px;
    text-decoration: none;
  }

  nav a:hover{
    text-decoration: underline;
  }

  nav a.is-active{
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  

  

  

  

  /* Theme toggle button */
  #theme-toggle{
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
    color: var(--text-color);
    margin-left: 0;
  }

  #theme-toggle:hover{
    opacity: 0.7;
  }

  #theme-80s-toggle{
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
    color: var(--text-color);
    margin-right: 0;
  }

  .theme-buttons{
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  #theme-80s-toggle:hover{
    opacity: 0.8;
  }

  #theme-80s-toggle .bi{
    font-size: 22px;
    line-height: 1;
    display: block;
  }

  

  

  

  .sun-icon{
    display: none;
  }

  .moon-icon{
    display: block;
  }

  [data-theme="dark"] .sun-icon{
    display: block;
  }

  [data-theme="dark"] .moon-icon{
    display: none;
  }

  /* About box */
  .about{
    width: calc(100% + 50px);
    max-width: none;
    margin-left: -25px;
    margin-top: calc(var(--gap) * 2);
    margin-bottom: calc(var(--gap) * 2);
    position: relative;
  }

  .about::after{
    content: "";
    display: block;
    clear: both;
  }

  .about-photo{
    position: absolute;
    width: 128px;
    height: 128px;
    left: -150px;
    top: 50%;
    transform: translateY(-50%);
    background-image: var(--about-photo-light);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: transparent;
  }

  [data-theme="dark"] .about-photo{
    background-image: var(--about-photo-dark);
  }


  .about-inner{
    font-size: 0.95em;
    padding: 0.6rem 20px;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }

  

  

  [data-theme="dark"] .about-inner{
    border-color: rgba(255, 255, 255, 0.2);
  }

  /* Footer icons */
  .footer-icons{
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 12px 0;
  }

  .typing-words{
    font-weight: 600;
  }

  .typing-caret{
    display: inline-block;
    width: 10px;
    height: 1em;
    border-left: 2px solid #fff;
    animation: caret-blink 1s steps(2, start) infinite;
    align-self: center;
  }

  [data-theme="dark"] .typing-caret{
    border-left-color: #6adcff;
  }

  .footer-typing{
    position: relative;
    height: 1.4em;
    font-size: 1.15em;
    margin-bottom: 8px;
    width: 100%;
    line-height: 1.2;
  }

  .typing-label{
    position: absolute;
    right: 50%;
    white-space: nowrap;
    text-align: right;
  }

  .typing-output{
    position: absolute;
    left: 50%;
    padding-left: 6px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    line-height: 1.2;
  }

  .typing-words{
    white-space: nowrap;
  }
  @keyframes caret-blink{
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  

  .footer-icon{
    display: inline-flex;
    width: 24px;
    height: 24px;
    color: var(--text-color);
  }

  .footer-icon svg{
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  /* Work items */
  .work-item{
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin: 0 0 var(--gap) 0;
  }

  

  

  

  

  .work-item-media{
    width: 160px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 6px;
    margin-left: -160px;
  }

  .work-item-media img{
    width: 100%;
    height: auto;
    display: block;
  }

  .work-item-title{
    margin: 0 0 0.35rem 0;
    font-weight: 600;
  }

  

  .work-item-description{
    margin: 0;
  }

  /* Post heading list style */
  ul.blog-posts li{
    display: block;
  }

  .post-heading{
    display: inline-block;
    padding-bottom: 0;
    text-decoration: none;
  }

  .post-heading:hover{
    text-decoration: none;
  }

  .post-heading:hover .post-date-inline{
    text-decoration: none;
  }

  .post-title{
    display: inline;
    background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3));
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 100% 1px;
    padding-bottom: 1px;
  }

  

  

  

  .post-heading:hover .post-title{
    background-image: linear-gradient(currentColor, currentColor);
  }

  

  .post-date-inline{
    margin-left: 6px;
    font-size: 0.85em;
    color: rgba(0, 0, 0, 0.6);
    text-decoration: none;
  }

  .tag-link{
    text-decoration: none;
  }

  .tag-link:hover{
    text-decoration: none;
  }

  .tag-hash{
    text-decoration: none;
  }

  .tag-text{
    display: inline-block;
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 100% 1px;
    padding-bottom: 1px;
  }

  .tag-link:hover .tag-text{
    background-size: 100% 2px;
  }

  

  [data-theme="dark"] .post-date-inline{
    color: rgba(255, 255, 255, 0.6);
  }

  [data-theme="dark"] .post-title{
    background-image: linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.35));
  }

  

  

  @media (max-width: 720px){
    .header-container{
      gap: 12px;
    }

    .logo{
      position: static;
      transform: none;
    }

    .about-photo{
      position: static;
      transform: none;
      margin: 0 auto var(--gap) auto;
      width: 96px;
      height: 120px;
    }

    .work-item{
      flex-direction: column;
    }

    .work-item-media{
      width: 100%;
    }
  }

  /* Tape deck (80s mode only) - BOOMBOX STYLE */
  

  

  /* Chrome strip at top */
  

  

  

  

  

  

  

  

  

  

  /* VU meter display */
  

  

  

  

  .reel-left{
    left: 12px;
  }

  .reel-right{
    right: 12px;
  }

  

  /* Track info display */
  

  

  /* LIVE indicator */
  

  @keyframes live-pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Volume slider */
  

  

  

  

  /* Playing state */
  

  

  

  
  
  
  
  
  
  
  

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.15s !important;
    }
  }

  @keyframes float{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(4deg); }
  }

  @keyframes float-reverse{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(16px) rotate(-4deg); }
  }

  @keyframes pulse-glow{
    0%, 100% { box-shadow: 0 0 18px rgba(255, 58, 242, 0.5); }
    50% { box-shadow: 0 0 36px rgba(255, 58, 242, 0.7), 0 0 60px rgba(0, 245, 212, 0.5); }
  }

  @keyframes gradient-shift{
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes spin-slow{
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes wiggle{
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  @keyframes float-chaos{
    0% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25% { transform: translate(-12px, 8px) rotate(6deg) scale(1.05); }
    50% { transform: translate(14px, -10px) rotate(-6deg) scale(0.95); }
    75% { transform: translate(-6px, -14px) rotate(10deg) scale(1.02); }
    100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  }

  @keyframes zig-chaos{
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-10px) rotate(-6deg); }
    50% { transform: translateX(12px) rotate(6deg); }
    75% { transform: translateX(-6px) rotate(-10deg); }
  }

  @keyframes spin-chaos{
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes squiggle-chaos{
    0% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(-8px) rotate(8deg); }
    60% { transform: translateY(10px) rotate(-8deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* New synthwave animations */
  @keyframes sun-pulse{
    0%, 100% {
      box-shadow:
        0 0 60px rgba(255, 100, 0, 0.5),
        0 0 120px rgba(255, 0, 102, 0.3),
        0 0 200px rgba(255, 0, 102, 0.2);
    }
    50% {
      box-shadow:
        0 0 80px rgba(255, 100, 0, 0.6),
        0 0 160px rgba(255, 0, 102, 0.4),
        0 0 260px rgba(255, 0, 102, 0.25);
    }
  }

  @keyframes grid-scroll{
    0% { background-position: 0 0; }
    100% { background-position: 0 30px; }
  }

  @keyframes twinkle{
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  @keyframes scanline-flicker{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.98; }
  }

  @keyframes vhs-tracking{
    0%, 90%, 100% { opacity: 0; }
    92%, 98% { opacity: 1; }
  }

  @keyframes vhs-line{
    0% { top: -10%; }
    100% { top: 110%; }
  }

  @keyframes neon-flicker{
    0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
      opacity: 1;
      text-shadow:
        0 0 5px var(--max-accent-2),
        0 0 10px var(--max-accent-2),
        0 0 20px var(--max-accent-2),
        0 0 40px var(--max-accent-1),
        0 0 80px var(--max-accent-1);
    }
    20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
      opacity: 0.85;
      text-shadow:
        0 0 3px var(--max-accent-2),
        0 0 6px var(--max-accent-2),
        0 0 12px var(--max-accent-2);
    }
  }

  @keyframes chrome-flash{
    0%, 85%, 100% { opacity: 0; }
    90% { opacity: 0.3; }
    95% { opacity: 0; }
  }

  @keyframes vu-bounce{
    0% { transform: scaleY(0.2); }
    100% { transform: scaleY(0.9); }
  }

  @keyframes marquee{
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }

  /* Cursor trail for 80s mode */
  

  /* Smooth transitions for theme switching */
  html{
    transition: background-color 0.3s ease;
  }

  

  /* Link hover effects in 80s mode */
  

  

  /* Parallax scroll hint for 80s */
  

  .pullquote{
    position: relative;
    margin: calc(var(--gap) * 1.5) 0;
    padding: 24px 28px;
    border: 4px solid #000;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1));
    font-size: 1.2em;
    font-weight: 600;
    font-style: normal;
    color: var(--heading-color);
    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.2);
  }

  .pullquote::before{
    content: "“";
    position: absolute;
    top: -18px;
    left: 12px;
    font-size: 3rem;
    color: var(--heading-color);
  }

  .pullquote::after{
    content: "”";
    position: absolute;
    bottom: -24px;
    right: 12px;
    font-size: 3rem;
    color: var(--heading-color);
  }

  [data-theme="dark"] .pullquote{
    border-color: rgba(255, 255, 255, 0.6);
    background: linear-gradient(135deg, rgba(44, 53, 57, 0.6), rgba(44, 53, 57, 0.2));
    color: var(--heading-color);
  }

  
</style>
