<script>
  // Theme toggle functionality
  const themeToggle = document.getElementById('theme-toggle');
  const theme80sToggle = document.getElementById('theme-80s-toggle');
  let tapeDeck = null;
  let playBtn = null;
  let prevBtn = null;
  let nextBtn = null;
  let volumeSlider = null;
  let trackNameEl = null;
  let playIcon = null;
  let pauseIcon = null;
  let tapeAudio = null;
  let eightiesLayer = null;
  let cursorTrailRAF = null;
  const html = document.documentElement;
  const themeKey = 'theme';
  const themePrevKey = 'theme-prev';

  // Synthwave radio stations (streaming)
  const stations = [
    { name: 'NIGHTWAVE PLAZA', src: 'https://radio.plaza.one/mp3' },
    { name: 'SYNTHWAVE RADIO', src: 'https://stream.synthwave.radio/320' },
    { name: 'NIGHTRIDE FM', src: 'https://stream.nightride.fm/nightride.m4a' }
  ];
  let currentStation = 0;

  function ensure80sFonts() {
    if (document.getElementById('theme-80s-fonts')) return;
    const link = document.createElement('link');
    link.id = 'theme-80s-fonts';
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Outfit:wght@700;800;900&family=Bangers&family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap';
    document.head.appendChild(link);
  }

  function ensure80sCss() {
    if (document.getElementById('theme-80s-css')) return;
    const link = document.createElement('link');
    link.id = 'theme-80s-css';
    link.rel = 'stylesheet';
    link.href = '/css/80s.css';
    document.head.appendChild(link);
  }

  function ensure80sLayer() {
    if (eightiesLayer) return;
    const layer = document.createElement('div');
    layer.id = 'eighties-layer';
    layer.innerHTML = `
      <div class="maxi-shapes" aria-hidden="true">
        <span class="shape shape-circle shape-c1"></span>
        <span class="shape shape-circle shape-c2"></span>
        <span class="shape shape-circle shape-c3"></span>
        <span class="shape shape-circle shape-c4"></span>
        <span class="shape shape-circle shape-c5"></span>
        <span class="shape shape-tri shape-t1"></span>
        <span class="shape shape-tri shape-t2"></span>
        <span class="shape shape-tri shape-t3"></span>
        <span class="shape shape-tri shape-t4"></span>
        <span class="shape shape-tri shape-t5"></span>
        <span class="shape shape-zig shape-z1"></span>
        <span class="shape shape-zig shape-z2"></span>
        <span class="shape shape-zig shape-z3"></span>
        <span class="shape shape-zig shape-z4"></span>
        <span class="shape shape-zig shape-z5"></span>
        <span class="shape shape-confetti shape-confetti-1"></span>
        <span class="shape shape-confetti shape-confetti-2"></span>
        <span class="shape shape-confetti shape-confetti-3"></span>
        <span class="shape shape-confetti shape-confetti-4"></span>
        <span class="shape shape-squiggle shape-squiggle-1"></span>
        <span class="shape shape-squiggle shape-squiggle-2"></span>
        <span class="shape shape-squiggle shape-squiggle-3"></span>
      </div>
      <div class="synthwave-scene" aria-hidden="true">
        <div class="horizon-glow"></div>
        <div class="retro-sun"></div>
        <div class="palm-tree palm-tree-left">
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-trunk"></div>
        </div>
        <div class="palm-tree palm-tree-right">
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-frond"></div>
          <div class="palm-trunk"></div>
        </div>
        <div class="neon-grid"></div>
      </div>
      <div class="stars" aria-hidden="true"></div>
      <div class="crt-overlay" aria-hidden="true"></div>
      <div class="vhs-glitch" aria-hidden="true"></div>
      <div class="cursor-trail-container" aria-hidden="true"></div>
      <div class="tape-deck" aria-hidden="true">
        <div class="tape-window">
          <div class="tape-vu-meter">
            <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
            <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          </div>
          <span class="tape-reel reel-left"></span>
          <span class="tape-reel reel-right"></span>
          <span class="tape-tape"></span>
        </div>
        <div class="tape-track-info">
          <span class="track-name">NIGHTWAVE PLAZA</span>
        </div>
        <div class="tape-controls">
          <button class="tape-button prev-btn" type="button" aria-label="Previous track">
            <i class="bi bi-skip-backward-fill"></i>
          </button>
          <button class="tape-button play-btn" type="button" aria-label="Play/Pause">
            <i class="bi bi-play-fill play-icon"></i>
            <i class="bi bi-pause-fill pause-icon" style="display:none;"></i>
          </button>
          <button class="tape-button next-btn" type="button" aria-label="Next track">
            <i class="bi bi-skip-forward-fill"></i>
          </button>
        </div>
        <div class="tape-volume">
          <span class="tape-volume-label">VOL</span>
          <input type="range" class="tape-volume-slider" min="0" max="100" value="70" aria-label="Volume">
        </div>
        <audio id="tape-audio" preload="none"></audio>
      </div>
    `;
    document.body.appendChild(layer);
    eightiesLayer = layer;

    tapeDeck = layer.querySelector('.tape-deck');
    playBtn = layer.querySelector('.play-btn');
    prevBtn = layer.querySelector('.prev-btn');
    nextBtn = layer.querySelector('.next-btn');
    volumeSlider = layer.querySelector('.tape-volume-slider');
    trackNameEl = layer.querySelector('.track-name');
    playIcon = layer.querySelector('.play-icon');
    pauseIcon = layer.querySelector('.pause-icon');
    tapeAudio = layer.querySelector('#tape-audio');
  }

  function teardown80sLayer() {
    if (cursorTrailRAF) {
      cancelAnimationFrame(cursorTrailRAF);
      cursorTrailRAF = null;
    }
    if (eightiesLayer) {
      eightiesLayer.remove();
      eightiesLayer = null;
    }
    tapeDeck = null;
    playBtn = null;
    prevBtn = null;
    nextBtn = null;
    volumeSlider = null;
    trackNameEl = null;
    playIcon = null;
    pauseIcon = null;
    tapeAudio = null;
  }

  // Check for saved theme preference or system preference
  const savedTheme = localStorage.getItem(themeKey);
  if (savedTheme) {
    html.setAttribute('data-theme', savedTheme);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    html.setAttribute('data-theme', 'dark');
  }

  // Initialize 80s mode elements if theme is 80s
  function init80sMode() {
    if (html.getAttribute('data-theme') === '80s') {
      ensure80sCss();
      ensure80sFonts();
      ensure80sLayer();
      generateStars();
      initCursorTrail();
      bindTapeControls();
    }
  }

  function stopTape() {
    if (tapeAudio && !tapeAudio.paused) {
      tapeAudio.pause();
    }
    if (tapeDeck) {
      tapeDeck.classList.remove('is-playing');
    }
  }

  function unload80sFonts() {
    const link = document.getElementById('theme-80s-fonts');
    if (link) link.remove();
  }

  function unload80sCss() {
    const link = document.getElementById('theme-80s-css');
    if (link) link.remove();
  }

  function startTape() {
    if (!tapeAudio) return;
    if (!tapeAudio.src && stations[currentStation]) {
      tapeAudio.src = stations[currentStation].src;
      if (trackNameEl) trackNameEl.textContent = stations[currentStation].name;
    }
    if (tapeAudio.paused) {
      tapeAudio.play().catch(() => {
        console.log('Stream playback failed - user gesture required');
      });
      if (tapeDeck) {
        tapeDeck.classList.add('is-playing');
      }
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') {
      stopTape();
    }
  });

  window.addEventListener('blur', () => {
    stopTape();
  });

  // Generate random stars
  function generateStars() {
    const starsContainer = eightiesLayer ? eightiesLayer.querySelector('.stars') : null;
    if (!starsContainer || starsContainer.children.length > 0) return;

    for (let i = 0; i < 50; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 60 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.animationDuration = (2 + Math.random() * 2) + 's';
      starsContainer.appendChild(star);
    }
  }

  // Cursor trail effect
  function initCursorTrail() {
    const trailContainer = eightiesLayer ? eightiesLayer.querySelector('.cursor-trail-container') : null;
    if (!trailContainer) return;

    const trailLength = 12;
    const trails = [];

    for (let i = 0; i < trailLength; i++) {
      const trail = document.createElement('div');
      trail.className = 'cursor-trail';
      trail.style.opacity = (1 - i / trailLength) * 0.6;
      trail.style.transform = `scale(${1 - i / trailLength * 0.5})`;
      trailContainer.appendChild(trail);
      trails.push({ el: trail, x: 0, y: 0 });
    }

    let mouseX = 0, mouseY = 0;

    document.addEventListener('mousemove', (e) => {
      if (html.getAttribute('data-theme') !== '80s') return;
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateTrails() {
      if (html.getAttribute('data-theme') === '80s') {
        trails[0].x = mouseX;
        trails[0].y = mouseY;

        for (let i = 1; i < trails.length; i++) {
          trails[i].x += (trails[i-1].x - trails[i].x) * 0.3;
          trails[i].y += (trails[i-1].y - trails[i].y) * 0.3;
        }

        trails.forEach((trail, i) => {
          trail.el.style.left = trail.x + 'px';
          trail.el.style.top = trail.y + 'px';
          trail.el.style.opacity = (1 - i / trailLength) * 0.5;
        });
      } else {
        trails.forEach(trail => trail.el.style.opacity = 0);
      }
      cursorTrailRAF = requestAnimationFrame(animateTrails);
    }
    animateTrails();
  }

  // Toggle theme on button click
  themeToggle.addEventListener('click', () => {
    const currentTheme = html.getAttribute('data-theme');
    if (currentTheme === '80s') {
      const prevTheme = localStorage.getItem(themePrevKey) || 'light';
      const newTheme = prevTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem(themeKey, newTheme);
      stopTape();
      teardown80sLayer();
      unload80sFonts();
      unload80sCss();
      return;
    }
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem(themeKey, newTheme);
  });

  theme80sToggle.addEventListener('click', () => {
    const currentTheme = html.getAttribute('data-theme') || 'light';
    if (currentTheme === '80s') {
      const prevTheme = localStorage.getItem(themePrevKey) || 'light';
      html.setAttribute('data-theme', prevTheme);
      localStorage.setItem(themeKey, prevTheme);
      stopTape();
      teardown80sLayer();
      unload80sFonts();
      unload80sCss();
      return;
    }
    localStorage.setItem(themePrevKey, currentTheme);
    html.setAttribute('data-theme', '80s');
    localStorage.setItem(themeKey, '80s');
    init80sMode();
    startTape();
  });

  // Tape deck functionality - Radio streaming
  function loadStation(index) {
    if (stations[index]) {
      currentStation = index;
      const wasPlaying = !tapeAudio.paused;
      tapeAudio.src = stations[index].src;
      if (trackNameEl) trackNameEl.textContent = stations[index].name;
      if (wasPlaying) {
        tapeAudio.play().catch(() => {
          console.log('Stream playback failed - station may be unavailable');
        });
      }
    }
  }

  function updatePlayButton(playing) {
    if (playIcon && pauseIcon) {
      playIcon.style.display = playing ? 'none' : 'inline';
      pauseIcon.style.display = playing ? 'inline' : 'none';
    }
    if (playing) {
      tapeDeck.classList.add('is-playing');
    } else {
      tapeDeck.classList.remove('is-playing');
    }
  }

  function bindTapeControls() {
    if (!tapeDeck || tapeDeck.dataset.bound === 'true') return;
    tapeDeck.dataset.bound = 'true';

    if (playBtn && tapeAudio) {
      playBtn.addEventListener('click', () => {
        if (!tapeAudio.src || tapeAudio.src === window.location.href) {
          loadStation(0);
        }
        if (tapeAudio.paused) {
          tapeAudio.play().catch((err) => {
            console.log('Stream playback failed:', err);
            const nextIndex = (currentStation + 1) % stations.length;
            loadStation(nextIndex);
            tapeAudio.play().catch(() => {});
          });
          updatePlayButton(true);
        } else {
          tapeAudio.pause();
          updatePlayButton(false);
        }
      });

      tapeAudio.addEventListener('error', () => {
        console.log('Stream error - trying next station');
        const nextIndex = (currentStation + 1) % stations.length;
        loadStation(nextIndex);
      });
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        const prevIndex = (currentStation - 1 + stations.length) % stations.length;
        loadStation(prevIndex);
        if (tapeAudio && !tapeAudio.paused) {
          tapeAudio.play().catch(() => {});
        }
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        const nextIndex = (currentStation + 1) % stations.length;
        loadStation(nextIndex);
        if (tapeAudio && !tapeAudio.paused) {
          tapeAudio.play().catch(() => {});
        }
      });
    }

    if (volumeSlider && tapeAudio) {
      volumeSlider.addEventListener('input', (e) => {
        tapeAudio.volume = e.target.value / 100;
      });
      tapeAudio.volume = volumeSlider.value / 100;
    }
  }

  // Initialize on page load
  init80sMode();

  // Parallax effect on scroll for synthwave scene
  window.addEventListener('scroll', () => {
    if (html.getAttribute('data-theme') !== '80s') return;
    const scrolled = window.pageYOffset;
    const scene = document.querySelector('.synthwave-scene');
    if (scene) {
      scene.style.transform = `translateY(${scrolled * 0.3}px)`;
    }
  });

  // Footer typing animation
  const typingTarget = document.querySelector('.typing-words');
  if (typingTarget) {
    const words = (typingTarget.dataset.words || '').split(',').map(w => w.trim()).filter(Boolean);
    let wordIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function tick() {
      if (!words.length) return;
      const current = words[wordIndex];
      const nextText = isDeleting
        ? current.slice(0, Math.max(charIndex - 1, 0))
        : current.slice(0, charIndex + 1);

      typingTarget.textContent = nextText;

      if (!isDeleting && nextText === current) {
        isDeleting = true;
        setTimeout(tick, 1200);
        return;
      }

      if (isDeleting && nextText === '') {
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        setTimeout(tick, 300);
        return;
      }

      charIndex = isDeleting ? charIndex - 1 : charIndex + 1;
      setTimeout(tick, isDeleting ? 80 : 120);
    }

    tick();
  }
</script>
